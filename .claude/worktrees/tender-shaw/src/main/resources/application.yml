server:
  servlet:
    session:
      tracking-modes: cookie
  port: 8080
  error:
    include-exception: true
    include-stacktrace: always
    whitelabel.enabled: false

spring:
  application:
    name: taskmansger
  profiles:
    active: prod
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 100MB
  mvc:
    view:
      prefix: /WEB-INF/views
      suffix: .jsp
    pathmatch:
      matching-strategy: ant_path_matcher
  devtools:
    livereload:
      enabled: true

mybatis:
  type-aliases-package: kr.co.dbinc.task.dto
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

default:
  start:
    continue:
      url: /user/dashboards/dashboardform