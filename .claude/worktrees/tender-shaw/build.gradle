plugins {
	id 'java'
	id 'war'
	id 'org.springframework.boot' version '3.4.2'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'kr.co.dbinc'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}

	all*.exclude group: 'org.springframework.boot', module: 'spring-boot-starter-logging'
	all*.exclude group: 'org.springframework.boot', module: 'logback-classic'
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	annotationProcessor 'org.projectlombok:lombok'
	providedRuntime 'org.springframework.boot:spring-boot-starter-tomcat'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	implementation 'org.springframework.boot:spring-boot-starter-validation'

	//jsp / jstl Setting
	implementation 'org.apache.tomcat.embed:tomcat-embed-jasper'
	implementation 'jakarta.servlet.jsp.jstl:jakarta.servlet.jsp.jstl-api'
	implementation 'jakarta.servlet:jakarta.servlet-api'
	implementation 'org.glassfish.web:jakarta.servlet.jsp.jstl'

	// MYBATIS
	implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:3.0.4'

	// Database
    implementation 'com.mysql:mysql-connector-j'

	// Web Flux
	implementation 'org.springframework.boot:spring-boot-starter-webflux'

	// JSON
	implementation 'com.googlecode.json-simple:json-simple:1.1.1'

	// log4j2
	implementation 'org.springframework.boot:spring-boot-starter-log4j2'

	// Common Codec
	implementation 'commons-codec:commons-codec:1.15'

	// mailgun sdk
//	implementation 'com.mailgun:mailgun-java:1.0.1'
    implementation 'com.mailgun:mailgun-java:1.1.3'

	// common io
	implementation 'org.apache.commons:commons-io:1.3.2'

	// file upload
	implementation 'commons-fileupload:commons-fileupload:1.5'

	// Azure Storage
	implementation 'com.microsoft.azure:azure-storage:8.6.6'

    // https://mvnrepository.com/artifact/com.google.api-client/google-api-client
    implementation 'com.google.api-client:google-api-client:2.8.1'
//    implementation 'com.google.api-client:google-api-client:1.32.1'

    // https://mvnrepository.com/artifact/com.google.api-client/google-api-client-jackson2
    implementation 'com.google.api-client:google-api-client-jackson2:1.20.0'

    // https://mvnrepository.com/artifact/com.google.auth/google-auth-library-oauth2-http
    implementation 'com.google.auth:google-auth-library-oauth2-http:1.39.0'
//    implementation 'com.google.auth:google-auth-library-oauth2-http:1.3.0'

// https://mvnrepository.com/artifact/com.google.apis/google-api-services-calendar
//    implementation 'com.google.apis:google-api-services-calendar:v3-rev411-1.25.0'
    implementation 'com.google.apis:google-api-services-calendar:v3-rev20240517-2.0.0'

    // https://mvnrepository.com/artifact/io.jsonwebtoken/jjwt-jackson
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    implementation 'io.jsonwebtoken:jjwt-impl:0.11.5'
    implementation 'io.jsonwebtoken:jjwt-jackson:0.11.5'

    // https://mvnrepository.com/artifact/org.springframework.boot/spring-boot-starter-aop
    implementation 'org.springframework.boot:spring-boot-starter-aop'
}

tasks.named('test') {
	useJUnitPlatform()
}
